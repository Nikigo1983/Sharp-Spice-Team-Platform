<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" role="img" aria-label="SPIORA">
  <defs>
    <linearGradient id="spioraBrand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4981A"/>
      <stop offset="100%" stop-color="#E82916"/>
    </linearGradient>
  </defs>

  <!-- SPIORA wordmark: white letters + gradient power-O and chevron-A -->
  <g font-family="Inter, Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="0.04em">
    <text x="10" y="86" fill="#FFFFFF">S</text>
    <text x="84" y="86" fill="#FFFFFF">P</text>
    <text x="164" y="86" fill="#FFFFFF">I</text>
    <text x="318" y="86" fill="#FFFFFF">R</text>
  </g>

  <!-- Power button as O -->
  <g transform="translate(224 16)">
    <path
      d="M20 22 A34 34 0 1 0 52 22"
      fill="none"
      stroke="url(#spioraBrand)"
      stroke-width="11"
      stroke-linecap="round"
    />
    <line
      x1="36"
      y1="4"
      x2="36"
      y2="40"
      stroke="url(#spioraBrand)"
      stroke-width="11"
      stroke-linecap="round"
    />
  </g>

  <!-- Chevron A -->
  <path
    d="M410 96 L450 20 L490 96"
    fill="none"
    stroke="url(#spioraBrand)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
